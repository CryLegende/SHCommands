# Menu /ega (/easygiveall) : le staff y choisit un item, répond dans le chat à chaque paramètre puis donne une raison ;
# la commande de l'item part alors de la console. Chaque give est écrit dans plugins/SHCommands/logs (un fichier par jour).
# /ega reload relit ce fichier et messages.yml. Les textes des messages sont dans messages.yml (section ega).
#
# menu:
#   title         Titre du menu, codes couleur avec &.
#   time-limit    Secondes sans réponse avant que la saisie en cours soit abandonnée (remis à zéro à chaque réponse).
#   cancel-word   Mot à taper dans le chat pour abandonner (majuscules ou minuscules).
#   logs          Écrit chaque give dans le journal.
#
# items.<id> : un item du menu, dans l'ordre du fichier (54 au plus).
#   name          Nom affiché dans le menu et dans le journal, codes couleur avec &.
#   item          material (obligatoire), lore (une ligne par élément, codes couleur avec &), enchanted (brillance).
#   command       Commande lancée par la console. Chaque %parametre% doit être décrit dans modifiers.
#   modifiers     Comment remplir chaque %parametre% :
#                   SELF            le pseudo du staff, sans rien demander
#                   NONE            un texte libre
#                   ANY             un nombre entier
#                   1-64            un nombre entier compris entre 1 et 64
#                   CONNECTED       le pseudo d'un joueur connecté sur ce serveur
#                   A/B/C           une valeur de la liste, majuscules et minuscules respectées
menu:
  title: '&lStaff &8| Menu de give'
  time-limit: 30
  cancel-word: Annuler
  logs: true
items:
  diamant:
    name: '&bDiamants'
    item:
      material: DIAMOND
      lore:
      - ''
      - '&fPermet de vous give X diamants'
      - '&8&l« &8Mini. 1 et Max. 64 &8&l»'
      - ''
      - '&7(Clic gauche)'
      enchanted: true
    command: give %staff% diamond %montant%
    modifiers:
      staff: SELF
      montant: 1-64
  bloc:
    name: '&6Blocs'
    item:
      material: GRASS_BLOCK
      lore:
      - ''
      - '&fPermet de vous give X blocs'
      - '&8&l« &8Tout nombre entier &8&l»'
      - ''
      - '&fBlocs valides:'
      - '&7stone, dirt, sand'
      - ''
      - '&7(Clic gauche)'
      enchanted: false
    command: give %staff% %bloc% %montant%
    modifiers:
      staff: SELF
      bloc: stone/dirt/sand
      montant: ANY
  message:
    name: '&aMessage à un joueur'
    item:
      material: PAPER
      lore:
      - ''
      - '&fPermet d''envoyer un message à un joueur connecté'
      - ''
      - '&7(Clic gauche)'
      enchanted: false
    command: tell %joueur% %texte%
    modifiers:
      joueur: CONNECTED
      texte: NONE
