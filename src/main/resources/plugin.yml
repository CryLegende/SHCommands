name: SHCommands
version: '${project.version}'
main: org.Cry_Legende.sHCommands.SHCommands
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, seuls les joueurs de ce serveur sont atteints.
softdepend:
  - SHNetwork

commands:
  shcommands:
    description: Administration de SHCommands
    usage: /shcommands reload
    permission: shcommands.admin.reload
  sm:
    description: Envoie un message coloré à un joueur
    usage: /<command> <player> <message>
  ps:
    description: Joue un son pour un joueur
    usage: /<command> <player> <sound> [<pitch>] [<yaw>]
  easygiveall:
    description: Menu de give du staff ; avec une commande, la lance pour chaque joueur connecté
    usage: /<command> [<commande avec %player%>]
    aliases:
      - ega
    permission: shcommands.giveall.menu

permissions:
  shcommands.use:
    description: Permet d'utiliser /sm et /ps
    default: op
  shcommands.admin:
    description: Toutes les sous-commandes de /shcommands
    default: op
    children:
      shcommands.admin.reload: true
  shcommands.admin.reload:
    description: Recharger la configuration avec /shcommands reload
    default: op
  shcommands.giveall:
    description: Donne accès à toutes les fonctions de /easygiveall (menu et commande pour chaque joueur)
    default: op
    children:
      shcommands.giveall.menu: true
      shcommands.giveall.command: true
  shcommands.giveall.menu:
    description: Ouvre le menu de give de /easygiveall
    default: op
  shcommands.giveall.command:
    description: Lance une commande pour chaque joueur connecté avec /easygiveall
    default: op
